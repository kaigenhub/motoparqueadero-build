name: Compilar MotoParqueadero para Ubuntu

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión del tag privado, sin la letra v (ejemplo: 0.1.10)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux-deb:
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Descargar código privado
        uses: actions/checkout@v4
        with:
          repository: kaigenhub/motoparqueadero
          ref: v${{ inputs.version }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 1

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Verificar versión
        env:
          EXPECTED_VERSION: ${{ env.RELEASE_VERSION }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const expected = process.env.EXPECTED_VERSION.replace(/^v/, "");
          const pkg = require("./package.json").version;
          const tauri = require("./src-tauri/tauri.conf.json").version;
          const cargo = fs.readFileSync("./src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1];
          const versions = { expected, pkg, tauri, cargo };
          if (new Set(Object.values(versions)).size !== 1) {
            console.error("Versiones desalineadas:", versions);
            process.exit(1);
          }
          console.log("Versión validada:", expected);
          NODE

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y publicar únicamente el paquete .deb
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: .
          owner: kaigenhub
          repo: motoparqueadero-releases
          releaseCommitish: main
          tagName: v${{ inputs.version }}
          releaseName: MotoParqueadero v${{ inputs.version }}
          releaseBody: Instalador Debian de MotoParqueadero para Ubuntu.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles deb
